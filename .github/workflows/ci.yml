name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Raycast lint (manifest, icon, ESLint, Prettier)
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (includes TypeScript check)
        run: npm run build
